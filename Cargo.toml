[package]
name = "libarena-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.96"
license = "LGPL-2.1-only OR BSD-2-Clause"
description = "BPF-arena-backed GlobalAlloc over libarena's buddy allocator, for Rust compiled straight to BPF with upstream rustc/LLVM (no aya, no bpf-linker)"
repository = "https://github.com/prozak/libarena-rs"
readme = "README.md"
keywords = ["bpf", "ebpf", "arena", "allocator", "no-std"]
categories = ["no-std", "memory-management"]
build = "build.rs"
include = ["src/**", "csrc/**", "vendor/libarena/LICENSE*", "vendor/libarena/libarena/src/*.c", "vendor/libarena/libarena/include/**", "targets/**", "build.rs", "README.md", "LICENSE*"]

[lib]
name = "libarena_rs"
crate-type = ["rlib"]

[features]
default = ["panic-handler", "alloc-error-handler"]
# Declare `#[global_allocator] static GLOBAL: ArenaAlloc` in this crate instead
# of in the program. Opt-in: with the shims defined outside the program crate,
# rustc sees them only as `allockind` declarations and legally elides
# allocations whose results it can forward (a `Box::new(x)` read straight
# back disappears), and the resulting code differs from the program-owned
# configuration the test corpus verifies.
global-allocator = []
# Provide `#[panic_handler]` (BPF targets only).
panic-handler = []
# Provide `#[alloc_error_handler]` (BPF targets only).
alloc-error-handler = []

[dependencies]

[workspace]
members = ["linker"]

[profile.release]
opt-level = 3
debug = 2
